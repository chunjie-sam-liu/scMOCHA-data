# ---------------------------------------------------------------------------
# Worked example, kept commented: a tool whose version constraints conflict
# with the default environment gets its own feature + environment rather than
# a downgrade of the root env. Copy the shape, not the package names.
#
#   pixi run --environment <envname> <cmd>
#
# Here tensorQTL needs an mkl-backed pytorch, and mkl pulls a tbb newer than
# r-rstanarm and r-rcppparallel allow.
# ---------------------------------------------------------------------------
# [workspace]
# # The CUDA build needs the __cuda virtual package, declared as a third entry
# # on the same linux-64 subdir. Only tensorqtl-gpu binds to it, and the default
# # environment pins its own platforms so it never solves for that entry.
# platforms = [
#   "linux-64",
#   "osx-arm64",
#   { name = "linux-64-cuda12", platform = "linux-64", cuda = "12" },
# ]
#
# [feature.tensorqtl]
# platforms = ["linux-64"]
#
# [feature.tensorqtl.dependencies]
# python = "3.12.*"
# pip = "*"
# numpy = "*"
# pandas = "*"
# scipy = "*"
# pyarrow = "*"
# plink2 = ">=2.0.0a.6.9,<3"
# pandas-plink = "*"
# rpy2 = "*"
# bioconductor-qvalue = "*"
#
# [feature.tensorqtl.pypi-dependencies]
# tensorqtl = { git = "https://github.com/broadinstitute/tensorqtl.git", rev = "master" }
#
# [feature.tensorqtl-cpu]
# platforms = ["linux-64"]
#
# [feature.tensorqtl-cpu.dependencies]
# pytorch = { version = "2.13.*", build = "cpu_mkl*" }
#
# # This environment only installs and runs on a GPU node, never on a login or
# # CPU compute node.
# [feature.tensorqtl-gpu]
# platforms = ["linux-64-cuda12"]
#
# [feature.tensorqtl-gpu.dependencies]
# pytorch = { version = "2.13.*", build = "cuda*_mkl*" }
#
# [environments]
# default = { platforms = ["linux-64", "osx-arm64"] }
# tensorqtl = { features = ["tensorqtl", "tensorqtl-cpu"], no-default-feature = true }
# tensorqtl-gpu = { features = ["tensorqtl", "tensorqtl-gpu"], no-default-feature = true }
