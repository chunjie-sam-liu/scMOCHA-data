[workspace]
authors = ["chunjie-sam-liu <chunjie-sam-liu@foxmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "PROJECT_NAME"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"


[tasks]
remote-install = "Rscript package.R"
update-jutils = "Rscript -e 'remotes::install_github(\"chunjie-sam-liu/jutils\")'"
sync-lab = "bash tools/sync-lab.sh"
format = "bash tools/format.sh"


