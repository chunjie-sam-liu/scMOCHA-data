# Linting policy for `pixi run lint` (tools/lint.sh -> jarl check).
#
# Jarl has no severity levels: every rule violation prints as `warning: <rule>`
# and is counted as an error in the summary. The only true `error:` is a parse
# failure, which exits 255. "Errors only, no warnings" is therefore a choice of
# rule category, not a severity switch.

[lint]
# Keep the two categories that find defects:
#   CORR  code that is outright wrong or useless
#   SUSP  code that is most likely wrong or useless
# Drop the three that do not: PERF (works, just slower), READ (works, just less
# pretty -- air already owns layout), and COMM, which only reports
# `# jarl-ignore` comments that do nothing.
select = ["CORR", "SUSP"]

# `--fix` may only rewrite what is outright wrong; everything else is reviewed
# by hand. Kept inside `select` so `--fix` is not a silent no-op.
fixable = ["CORR"]

# Every suppression lives here, never in a script. One file carries the whole
# policy, so a rule is judged once for the project instead of being argued
# again at each call site.
#
# unused_object: Jarl analyses one file at a time, so every constant in a
#   sourced `config.R` and every palette in a `color.R` looks unused. Drop this
#   entry in a package repository, where the rule is real signal.
ignore = ["unused_object", "internal_function", "redundant_ifelse", "glue"]

# Vendored or generated sources this project does not maintain, e.g. "note/**".
exclude = []

# Also skip the file patterns Jarl knows are generated by other tools. The
# built environment under `.pixi/` is already skipped without being listed.
default-exclude = true

# `# jarl-ignore` comments do not belong in R sources: widen `ignore` above
# instead. COMM is not selected, so the linter will not catch one -- this is a
# review rule, checked with:
#   grep -rn 'jarl-ignore' --include='*.R' .
