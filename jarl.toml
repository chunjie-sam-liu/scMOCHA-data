# Linting policy for `pixi run lint` (tools/lint.sh -> jarl check).
#
# Jarl has no severity levels: every rule violation prints as `warning: <rule>`
# and is counted as an error in the summary. The only true `error:` is a parse
# failure, which exits 255. "Errors only, no warnings" is therefore a choice of
# rule category, not a severity switch.

[lint]
# Keep the three categories that find defects:
#   CORR  code that is outright wrong or useless
#   SUSP  code that is most likely wrong or useless
#   COMM  `# jarl-ignore` comments that silently do nothing
# Drop the two that only flag correct code: PERF (works, just slower) and READ
# (works, just less pretty) -- air already owns layout, and READ alone is 398
# hits across this repository.
select = ["CORR", "SUSP"]

# `--fix` may only rewrite what is outright wrong; everything else is reviewed
# by hand. Kept inside `select` so `--fix` is not a silent no-op.
fixable = ["CORR"]

# Every suppression lives here, never in a script. One file carries the whole
# policy, so a rule is judged once for the repository instead of being argued
# again at each call site.
#
# unused_object: Jarl analyses one file at a time, so every constant in a stage
#   `config.R` and every palette in a track `color.R` looks unused -- they are
#   consumed by the step scripts that `source()` those files. That is this
#   repository's layout, not a defect: 169 hits, over 100 from config and color
#   files alone.
# internal_function: `tests/meffil-normalization/` reaches into meffil with
#   `:::` on purpose, because tracing meffil's internal normalization has no
#   public API. 7 hits, all deliberate.
ignore = [
  "unused_object",
  "internal_function",
  "redundant_ifelse",
  "glue",
  "duplicated_arguments",
]

# Vendored lab reference scripts: another group's code, kept verbatim with
# their own hard-coded paths. Not ours to fix.
exclude = ["note/**"]

# Also skip the file patterns Jarl knows are generated by other tools. The
# built environment under `.pixi/` and the symlinked data/results/logs/tmp
# roots are already skipped without being listed here.
default-exclude = true

# `# jarl-ignore` comments do not belong in R sources. COMM stays selected so
# any that appear are reported: widen `ignore` above instead.
